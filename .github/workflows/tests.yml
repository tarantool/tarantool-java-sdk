name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths:
      - '**/*.java'
      - 'pom.xml'
      - '**/pom.xml'
      - '**/src/main/resources/**'
      - '**/src/test/resources/**'
  pull_request:
    branches: [ master ]
    paths:
      - '**/*.java'
      - 'pom.xml'
      - '**/pom.xml'
      - '**/src/main/resources/**'
      - '**/src/test/resources/**'
  workflow_dispatch:

env:
#  Переменная, указывающая testcontainers в какой репозитории искать образы
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: "registry.ps.tarantool.io/"
#  Переменная, используемая в тестах в качестве префикса к названию образа. Переопределяется локально, если необходимо
  TARANTOOL_REGISTRY: "registry.ps.tarantool.io/"

jobs:
  tests-unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Docker login to private registry
        run: docker login "${{ secrets.PS_REGISTRY_URL }}" -u admin -p "${{ secrets.PS_REGISTRY_PASSWORD }}"

      # - name: Cache docker images
      #   uses: satackey/action-docker-layer-caching@v0.0.11
      #   continue-on-error: true

      - name: Build and run unit tests
        run: ./mvnw -B verify -Djacoco.destFile=target/jacoco-unit.exec --file pom.xml

      - name: Print system images
        run: docker images

      - name: Upload jacoco exec
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-unit
          path: "**/target/jacoco-unit.exec"
          retention-days: 1

  tests-box-integration:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        tarantool-version: [ "2.11.8-ubuntu20.04", "3.5.0" ]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Docker login to private registry
        run: docker login "${{ secrets.PS_REGISTRY_URL }}" -u admin -p "${{ secrets.PS_REGISTRY_PASSWORD }}"

      # - name: Cache docker images
      #   uses: satackey/action-docker-layer-caching@v0.0.11
      #   continue-on-error: true

      - name: Set locale environment variables
        run: |
          
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen en_US.UTF-8
          sudo update-locale LANG=en_US.UTF-8
          export LANG=en_US.UTF-8
          export LANGUAGE=en_US:en
          export LC_ALL=en_US.UTF-8
          locale
          echo "LANG=en_US.UTF-8" >> $GITHUB_ENV
          echo "LANGUAGE=en_US:en" >> $GITHUB_ENV
          echo "LC_ALL=en_US.UTF-8" >> $GITHUB_ENV

      - name: Build and run integration tests
        env:
          TARANTOOL_VERSION: ${{ matrix.tarantool-version }}
          TARANTOOL_SERVER_USER: root
          TARANTOOL_SERVER_GROUP: root
        run: ./mvnw -B test -P box-integration -Djacoco.destFile=target/jacoco-box-${{ matrix.tarantool-version }}.exec --file pom.xml

      - name: Print system images
        run: docker images

      - name: Upload jacoco exec
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-box-${{ matrix.tarantool-version }}
          path: "**/target/jacoco-box-${{ matrix.tarantool-version }}.exec"
          retention-days: 1

  tests-crud-integration:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        tarantool-version: [ "2.11.8-ubuntu20.04", "3.5.0" ]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Docker login to private registry
        run: docker login "${{ secrets.PS_REGISTRY_URL }}" -u admin -p "${{ secrets.PS_REGISTRY_PASSWORD }}"

      - name: Set locale environment variables
        run: |
          
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen en_US.UTF-8
          sudo update-locale LANG=en_US.UTF-8
          export LANG=en_US.UTF-8
          export LANGUAGE=en_US:en
          export LC_ALL=en_US.UTF-8
          locale
          echo "LANG=en_US.UTF-8" >> $GITHUB_ENV
          echo "LANGUAGE=en_US:en" >> $GITHUB_ENV
          echo "LC_ALL=en_US.UTF-8" >> $GITHUB_ENV

      # - name: Cache docker images
      #   uses: satackey/action-docker-layer-caching@v0.0.11
      #   continue-on-error: true

      - name: Build and run integration tests
        env:
          TARANTOOL_VERSION: ${{ matrix.tarantool-version }}
          TARANTOOL_SERVER_USER: root
          TARANTOOL_SERVER_GROUP: root
        run: ./mvnw -B test -P crud-integration -Djacoco.destFile=target/jacoco-crud-${{ matrix.tarantool-version }}.exec --file pom.xml

      - name: Print system images
        run: docker images

      - name: Upload jacoco exec
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-crud-${{ matrix.tarantool-version }}
          path: "**/target/jacoco-crud-${{ matrix.tarantool-version }}.exec"
          retention-days: 1

  merge-jacoco-report:
    name: Merge JaCoCo and upload coverage
    needs:
      - tests-unit
      - tests-box-integration
      - tests-crud-integration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Download jacoco exec files
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-*
          path: .
          merge-multiple: true

      - name: Build classes and aggregate JaCoCo report
        run: ./mvnw -B -DskipTests -Darguments=-DskipTests -Dcheckstyle.skip -Ddependency-check.skip verify -pl jacoco-coverage-aggregate-report -am --file pom.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: jacoco-coverage-aggregate-report/target/site/jacoco-aggregate/jacoco.xml
          fail_ci_if_error: true
